<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <title>User Registration</title>
  </head>
  <body>
    <h1>User Registration</h1>
    <form method="POST">
        <p>Username: <br> <input type="text" name="username" required autocomplete="username"></p>
        <p>Email: <br> <input type="email" name="email" required autocomplete="email"></p>
        <p>Password: <br> <input type="password" name="password" required autocomplete="new-password"></p>
        <p><button type="submit">Register</button></p>
    </form>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
  </body> 
</html>
